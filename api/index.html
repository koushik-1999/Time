<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Auto Timezone Clock</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            transition: all 0.3s;
        }
        .logo { font-size: 2.5rem; margin-bottom: 6px; }
        h1 {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .sub {
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        /* ===== TIME DISPLAY - FIXED SIZE ===== */
        .time-wrapper {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 16px 12px;
            margin: 12px 0 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .time {
            font-family: 'Courier New', monospace;
            font-size: clamp(2.8rem, 12vw, 4.2rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px rgba(99,102,241,0.15);
            letter-spacing: 3px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .time .colon {
            color: #6366f1;
            animation: blink 1s step-end infinite;
        }
        .time .ampm {
            font-size: clamp(1rem, 4vw, 1.4rem);
            color: #818cf8;
            font-weight: 600;
            margin-left: 4px;
            letter-spacing: 1px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .date {
            color: rgba(255,255,255,0.7);
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        .tz-info {
            color: rgba(255,255,255,0.35);
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(52,211,153,0.1);
            border: 1px solid rgba(52,211,153,0.15);
            border-radius: 20px;
            color: #34d399;
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }
        /* ===== JSON BOX - SCROLLABLE ===== */
        .json-box {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 18px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            color: #a5b4fc;
            overflow-x: auto;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.03);
            word-break: break-all;
            white-space: pre-wrap;
        }
        .json-box::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        .json-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .json-box::-webkit-scrollbar-thumb {
            background: rgba(99,102,241,0.3);
            border-radius: 10px;
        }
        .footer {
            margin-top: 14px;
            color: rgba(255,255,255,0.08);
            font-size: 0.55rem;
            letter-spacing: 1px;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card { padding: 24px 16px; border-radius: 20px; }
            .time-wrapper { padding: 12px 8px; }
            .logo { font-size: 2rem; }
            h1 { font-size: 1.1rem; }
            .badge { font-size: 0.55rem; padding: 3px 12px; }
            .json-box { max-height: 80px; font-size: 0.5rem; padding: 10px 12px; }
        }
        @media (max-width: 360px) {
            .card { padding: 18px 12px; }
            .time { font-size: 2.4rem; letter-spacing: 1px; }
            .time .ampm { font-size: 0.9rem; }
        }
        @media (min-width: 768px) {
            .card { padding: 40px 36px; max-width: 480px; }
            .time { font-size: 4.5rem; }
        }
        /* ===== LOADING ===== */
        .loading { color: rgba(255,255,255,0.2); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🌍</div>
        <h1>Auto Timezone Clock</h1>
        <div class="sub">Detected via your network</div>
        
        <!-- ===== TIME DISPLAY ===== -->
        <div class="time-wrapper">
            <div class="time" id="clock">
                <span id="hours">--</span><span class="colon">:</span>
                <span id="minutes">--</span><span class="colon">:</span>
                <span id="seconds">--</span>
                <span class="ampm" id="ampm">--</span>
            </div>
        </div>
        
        <div class="date" id="date">Loading...</div>
        <div class="tz-info" id="tz">📍 Detecting...</div>
        <div class="badge" id="status">🔄 Auto-Detecting</div>
        
        <!-- ===== JSON ===== -->
        <div class="json-box" id="json">Loading...</div>
        <div class="footer">⚡ Powered by IP Geolocation</div>
    </div>

    <script>
        // ===== CONFIG =====
        const API_URL = '/api/current-utc.js';
        let intervalId = null;

        // ===== 12-HOUR FORMAT FUNCTION =====
        function to12Hour(hour) {
            const h = hour % 12 || 12;
            const ampm = hour >= 12 ? 'PM' : 'AM';
            return { hours: h, ampm: ampm };
        }

        // ===== FETCH TIME =====
        async function fetchTime() {
            const timestamp = Date.now();
            const url = `${API_URL}?t=${timestamp}&_=${Math.random()}`;
            
            try {
                const res = await fetch(url, {
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                
                // ===== CONVERT TO 12-HOUR =====
                const { hours: h12, ampm } = to12Hour(data.hour);
                const h = String(h12).padStart(2, '0');
                const m = String(data.minute).padStart(2, '0');
                const s = String(data.seconds).padStart(2, '0');
                
                // Update clock
                document.getElementById('hours').textContent = h;
                document.getElementById('minutes').textContent = m;
                document.getElementById('seconds').textContent = s;
                document.getElementById('ampm').textContent = ampm;
                
                // Date & Timezone
                document.getElementById('date').textContent = 
                    `${data.dayOfWeek}, ${data.date}`;
                document.getElementById('tz').textContent = 
                    `📍 ${data.timeZone}`;
                document.getElementById('status').textContent = '✅ Auto-Detected';
                document.getElementById('status').style.borderColor = '#34d399';
                
                // JSON
                document.getElementById('json').textContent = 
                    JSON.stringify(data, null, 2);
                    
            } catch (e) {
                document.getElementById('json').textContent = 
                    '❌ Error: ' + e.message;
                document.getElementById('status').textContent = '⚠️ Error';
            }
        }

        // ===== TAB FOCUS FIX =====
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                console.log('🔄 Tab focused - Refreshing...');
                clearInterval(intervalId);
                fetchTime();
                intervalId = setInterval(fetchTime, 1000);
            }
        });

        // ===== PAGE LOAD =====
        fetchTime();
        intervalId = setInterval(fetchTime, 1000);

        // ===== BACK/FORWARD CACHE FIX =====
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                console.log('🔄 Page from cache - Refreshing...');
                fetchTime();
            }
        });

        console.log('✅ 12-Hour Clock started');
    </script>
</body>
</html>
