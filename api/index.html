<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Auto Timezone Clock</title>
    <!-- Disable caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .logo { font-size: 3rem; margin-bottom: 10px; }
        h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .sub {
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .time {
            font-family: 'Courier New', monospace;
            font-size: 4.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px rgba(99,102,241,0.2);
            letter-spacing: 4px;
            margin: 20px 0;
        }
        .time span {
            color: #6366f1;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .date { color: rgba(255,255,255,0.7); font-size: 1.2rem; margin-bottom: 6px; }
        .tz-info {
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            padding: 4px 16px;
            background: rgba(52,211,153,0.12);
            border: 1px solid rgba(52,211,153,0.2);
            border-radius: 20px;
            color: #34d399;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 16px;
        }
        .json-box {
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            padding: 16px;
            margin-top: 24px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: #a5b4fc;
            overflow-x: auto;
            max-height: 120px;
            overflow-y: auto;
        }
        .footer {
            margin-top: 20px;
            color: rgba(255,255,255,0.1);
            font-size: 0.6rem;
            letter-spacing: 1px;
        }
        .loading { color: rgba(255,255,255,0.3); font-size: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🌍</div>
        <h1>Auto Timezone Clock</h1>
        <div class="sub">Detected via your network location</div>
        
        <div class="time" id="clock">--<span>:</span>--<span>:</span>--</div>
        <div class="date" id="date">Loading...</div>
        <div class="tz-info" id="tz">Detecting...</div>
        <div class="badge" id="status">🔄 Auto-Detecting</div>
        
        <div class="json-box" id="json">Loading...</div>
        <div class="footer">⚡ Powered by IP Geolocation</div>
    </div>

    <script>
        // ===== CONFIG =====
        const API_URL = '/api/current-utc.js';
        let intervalId = null;

        // ===== FETCH TIME (NO CACHE) =====
        async function fetchTime() {
            const timestamp = Date.now();
            const url = `${API_URL}?t=${timestamp}&_=${Math.random()}`;
            
            try {
                const res = await fetch(url, {
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                
                // Update clock
                const h = String(data.hour).padStart(2, '0');
                const m = String(data.minute).padStart(2, '0');
                const s = String(data.seconds).padStart(2, '0');
                document.getElementById('clock').innerHTML = 
                    `${h}<span>:</span>${m}<span>:</span>${s}`;
                
                document.getElementById('date').textContent = 
                    `${data.dayOfWeek}, ${data.date}`;
                document.getElementById('tz').textContent = 
                    `📍 ${data.timeZone}`;
                document.getElementById('status').textContent = '✅ Auto-Detected';
                document.getElementById('status').style.borderColor = '#34d399';
                
                document.getElementById('json').textContent = 
                    JSON.stringify(data, null, 2);
                    
            } catch (e) {
                document.getElementById('json').textContent = 
                    '❌ Error: ' + e.message;
                document.getElementById('status').textContent = '⚠️ Error';
            }
        }

        // ===== FORCE REFRESH ON TAB FOCUS =====
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // Tab is visible again - immediate refresh
                console.log('🔄 Tab focused - Refreshing...');
                clearInterval(intervalId);
                fetchTime();
                // Restart interval
                intervalId = setInterval(fetchTime, 1000);
            }
        });

        // ===== PAGE LOAD =====
        fetchTime();
        intervalId = setInterval(fetchTime, 1000);

        // ===== PREVENT BACK/FORWARD CACHE =====
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                console.log('🔄 Page from bfcache - Refreshing...');
                fetchTime();
            }
        });

        console.log('✅ Clock started with auto-refresh on focus');
    </script>
</body>
</html>
